# Anteprima di ogni ramo che non sia main.
# Copia i file del ramo dentro il repository  hsagency587/cantieri-anteprime,
# in una cartella che si chiama come il ramo. Indirizzo:
#   https://hsagency587.github.io/cantieri-anteprime/<nome del ramo>/
# Sta fuori da /cantieri/ apposta: li' dentro il telefono la scambiava per
# l'app vera e apriva quella installata.
# Serve il segreto TOKEN_ANTEPRIME (Contents: lettura e scrittura, solo sul
# repository cantieri-anteprime).
name: Anteprime dei rami

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: anteprime
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Prendo i file del ramo
        uses: actions/checkout@v4
        with:
          path: ramo

      - name: Prendo il repository delle anteprime
        uses: actions/checkout@v4
        with:
          repository: hsagency587/cantieri-anteprime
          token: ${{ secrets.TOKEN_ANTEPRIME }}
          path: anteprime

      - name: Copio il ramo nella sua cartella
        run: |
          RAMO=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
          echo "RAMO=$RAMO" >> "$GITHUB_ENV"
          DEST="anteprime/$RAMO"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          rsync -a --exclude '.git' --exclude '.github' ramo/ "$DEST/"

      - name: Salvo
        run: |
          cd anteprime
          git config user.name "anteprime"
          git config user.email "anteprime@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Niente di nuovo da pubblicare."
            exit 0
          fi
          git commit -m "anteprima $RAMO"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 7
          done
          echo "Non sono riuscito a pubblicare."
          exit 1
