# Controlla i file a ogni caricamento e alza da solo il numero della cache in sw.js.
#
# ATTENZIONE, cambiato il 10/09/2026: il sito NON si pubblica più da qui.
# La pubblicazione è tornata a GitHub Pages "dal ramo main", perché il passo di
# pubblicazione via Actions si è piantato per un'ora. Conseguenza da sapere:
# questo controllo ORA AVVISA MA NON BLOCCA. Se app.js è rotto, GitHub manda una
# mail che dice che il lavoro è fallito, ma il file va online lo stesso.
name: Controlla e numero cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controlla
  cancel-in-progress: false

jobs:
  controlla:
    # Il commit fatto qui sotto porta [cache] nel messaggio: così non si richiama da solo.
    if: "!contains(github.event.head_commit.message, '[cache]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla che i file si leggano
        run: |
          node --check app.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Alza il numero della cache
        run: |
          NUOVO="cantieri-${GITHUB_SHA::7}"
          sed -i "s/^const VERSIONE = .*/const VERSIONE = '$NUOVO';/" sw.js
          node --check sw.js
          if git diff --quiet sw.js; then
            echo "Il numero era gia' quello giusto."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sw.js
            git commit -m "[cache] numero cache $NUOVO"
            git push
          fi
