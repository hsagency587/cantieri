<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova foto — CANTIERI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 40px;
    background: #0d0f12; color: #e6e6e6;
    font: 18px/1.5 -apple-system, system-ui, sans-serif;
  }
  h1 { font-size: 24px; margin: 8px 0 4px; letter-spacing: .04em; }
  .sotto { color: #9aa0a6; font-size: 16px; margin: 0 0 20px; }
  .btn {
    display: block; width: 100%; min-height: 64px;
    margin: 0 0 12px; padding: 12px 16px;
    border: 0; border-radius: 14px;
    font: 600 18px/1.2 inherit; color: #06210f; background: #3ddc84;
    cursor: pointer;
  }
  .btn.sec { background: #1c2128; color: #38bdf8; border: 1px solid #2d333b; }
  input[type=file] { display: none; }
  .card {
    margin: 16px 0 0; padding: 14px 16px;
    background: #161b22; border: 1px solid #2d333b; border-radius: 14px;
  }
  .card h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #9aa0a6; margin: 0 0 10px; }
  .riga { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid #21262d; }
  .riga:last-child { border-bottom: 0; }
  .riga b { font-weight: 600; }
  .ok { color: #3ddc84; }
  .att { color: #e3b341; }
  .err { color: #ff453a; }
  img#anteprima { display: block; width: 100%; height: auto; border-radius: 14px; margin-top: 12px; background: #000; }
  .nota { color: #9aa0a6; font-size: 16px; margin-top: 16px; }
</style>
</head>
<body>

<h1>PROVA FOTO</h1>
<p class="sotto">Serve a sapere se questo telefono sa rimpicciolire le foto e tenerle dritte. Non salva niente e non manda niente da nessuna parte.</p>

<button class="btn" id="b-scatta">Scatta una foto</button>
<button class="btn sec" id="b-rullino">Prendi una foto dal rullino</button>

<input type="file" id="f-scatta" accept="image/*" capture="environment">
<input type="file" id="f-rullino" accept="image/*">

<div id="esito"></div>

<p class="nota">Se la foto qui sotto si vede dritta come l'hai scattata, e il peso finale è molto più piccolo di quello di partenza, la prova è passata.</p>

<script>
'use strict';

/* Il lato lungo a cui si riduce. È il numero deciso per l'app. */
const LATO = 1600;
const QUALITA = 0.75;

const esito = document.getElementById('esito');

function peso(byte) {
  if (byte >= 1024 * 1024) return (byte / 1024 / 1024).toFixed(2).replace('.', ',') + ' MB';
  return Math.round(byte / 1024) + ' KB';
}

function riga(nome, valore, classe) {
  return '<div class="riga"><span>' + nome + '</span><b class="' + (classe || '') + '">' + valore + '</b></div>';
}

/* Si prova prima createImageBitmap con l'orientamento preso dalla foto: è il modo
   che raddrizza da solo. Se non c'è, si ripiega sull'immagine normale. */
async function apri(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { /* si prova l'altra strada */ }
  }
  return await new Promise(function (ok, no) {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = function () { URL.revokeObjectURL(url); ok(im); };
    im.onerror = function () { URL.revokeObjectURL(url); no(new Error('Il telefono non riesce ad aprire questa foto')); };
    im.src = url;
  });
}

async function riduci(file) {
  const partito = Date.now();
  const img = await apri(file);
  const lo = img.width, la = img.height;
  const scala = Math.min(1, LATO / Math.max(lo, la));
  const c = document.createElement('canvas');
  c.width = Math.round(lo * scala);
  c.height = Math.round(la * scala);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', QUALITA); });
  if (img.close) img.close();
  if (!blob) throw new Error('Il telefono non riesce a risalvare la foto in JPEG');
  return { blob: blob, prima: [lo, la], dopo: [c.width, c.height], millisecondi: Date.now() - partito };
}

async function prova(file) {
  if (!file) return;
  esito.innerHTML = '<div class="card"><h2>Lavoro in corso</h2><div class="riga"><span>Sto rimpicciolendo la foto…</span></div></div>';
  let r;
  try {
    r = await riduci(file);
  } catch (e) {
    esito.innerHTML = '<div class="card"><h2>Non è andata</h2>' +
      riga('Formato del file', file.type || 'sconosciuto') +
      riga('Errore', e.message, 'err') +
      '</div>';
    return;
  }
  const guadagno = file.size ? Math.round(100 - (r.blob.size / file.size) * 100) : 0;
  const heic = /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name || '');

  esito.innerHTML = '<div class="card"><h2>Com\'è andata</h2>' +
    riga('Formato di partenza', (file.type || 'non dichiarato') + (heic ? ' (HEIC)' : ''), heic ? 'att' : '') +
    riga('Peso di partenza', peso(file.size)) +
    riga('Misura di partenza', r.prima[0] + ' × ' + r.prima[1]) +
    riga('Peso finale', peso(r.blob.size), 'ok') +
    riga('Misura finale', r.dopo[0] + ' × ' + r.dopo[1], 'ok') +
    riga('Risparmio', guadagno + '%', 'ok') +
    riga('Tempo impiegato', r.millisecondi + ' millisecondi') +
    '</div>' +
    '<img id="anteprima" alt="la foto ridotta">';

  document.getElementById('anteprima').src = URL.createObjectURL(r.blob);
}

document.getElementById('b-scatta').addEventListener('click', function () { document.getElementById('f-scatta').click(); });
document.getElementById('b-rullino').addEventListener('click', function () { document.getElementById('f-rullino').click(); });
document.getElementById('f-scatta').addEventListener('change', function (e) { prova(e.target.files[0]); });
document.getElementById('f-rullino').addEventListener('change', function (e) { prova(e.target.files[0]); });
</script>

</body>
</html>
